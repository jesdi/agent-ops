capacity: 2   # box-wide: shared by every target, in-flight work first, then claims fewest-active-first
state_dir: /home/agent/agent-ops-state
# pass_interval_minutes: 10   # must match OnUnitActiveSec in the systemd timer
# Optional: repo where provisioning/pass-crash failure issues are filed.
# Unset -> those failures degrade to a Telegram ping + stderr log only.
infra_repo: example/agent-ops
# Optional: web console base URL (https://<box>.<tailnet>.ts.net). When set,
# the spec-review Telegram ping carries a "read & approve" deep link.
# console_url: https://box.tailnet.ts.net
budget_threshold: 0.8
racing_minutes: 30
racing_threshold: 0.95
# Weekly pace gate. The box may only spawn while the week's usage is at or
# under a schedule that counts weekend hours at weekend_weight (you are not
# around to answer sessions on weekends, so the saved share flows to
# Monday–Friday), plus pace_margin. Timezone is an IANA name.
pace_margin: 0.10
weekend_weight: 0.5
timezone: Europe/Madrid
# Session week share, per provider: how much of the weekly quota one 5-hour
# session spends when used up to budget_threshold (above 0, at most 1). With
# it, a provider that can no longer spend the rest of its week through the
# sessions left before its weekly reset is session-bound and is tried first.
# Absent: no provider is ever session-bound.
# session_week_share:
#   anthropic: 0.05
# Sized for capacity 2 on the 4 GB box: 2 active sessions x 1500m + ~1 GB
# system baseline fits 3.8 GB RAM with the zram cushion absorbing spikes.
# A session that overruns the cap OOMs inside its own container only.
session_memory: 1500m
session_cpus: "2"
# A live claude redraws its status line every second, so a session with no
# tmux output for this long is stuck (login/trust prompt, or a hung turn) and
# gets parked for the operator. 0 disables stall detection entirely.
stall_after_seconds: 600
# A session that ends its turn on background work (a long build, a gate run)
# is in a background wait: neither parked nor caught by the stall timer above.
# The cap clock starts at the first report and restarts when a report names
# new work; past this many seconds the task parks for the operator and the
# session is ended. Integer >= 1; default 10800 (3 hours).
background_wait_seconds: 10800
# How long a finished spec waits at the review gate for the operator. Once it
# expires the task parks: the spec session ends and BOTH its capacity unit and
# its E2E slot are freed, so the dispatcher keeps claiming and speccing the
# rest of the Ready queue overnight. Reply to the Telegram park message (or
# resume from the web console) to pick the review back up. 0 = park on the
# next pass; attaching holds the task — it will not park while you are attached.
# null = never auto-park (wait for the operator no matter how long it takes).
spec_review_grace_minutes: 15
# Box-wide cap on unfinished tasks (running, parked, awaiting review or CI,
# pr-open). The claim round stops at it even when capacity is free: every
# unfinished task keeps a worktree on disk. Must be >= capacity.
max_open: 10
# Days a finished task (done, failed, won't do) keeps its console card,
# worktree and local branch before the flush removes them.
done_retention_days: 7
# Rounds each bounded loop may run before the task parks for the operator
# (never fails). Defaults shown; every key is optional.
loop_caps:
  review: 2   # review-stage fix rounds
  gate: 2     # gate_cmd failures per ticket
  e2e: 3      # failed end-to-end runs
  ci: 3       # fixes on an open PR (red check, conflict, failed run)
# Which model, at which effort, runs which stage. A TRACK is a kind of work
# you name; its `when:` sentence is shown to the triage sweep (which picks the
# track for the spec stage, as the label track:<name>) and to the spec
# session (which picks the track for plan/implement/review once the scope is
# known). Each stage lists entries `provider/model[@effort]`. The dispatcher
# tries them by REQUIRED PACE, highest first: the entry whose weekly quota
# most needs spending before its reset (quota left / time left). The written
# order breaks ties and ranks entries with no weekly reading, which go last.
# A session-bound provider's entries (session_week_share above) go first,
# except on a pinned track (below).
# A priority mode set in the console (`auto` or a provider) replaces this
# order: a provider's name puts its entries first (see CONTEXT.md).
# It launches the first entry in that order the usage gate admits, keeps that
# pick for every session of the stage, and waits when none is admitted.
# A pinned track (`pinned:` below) is the exception: required pace, the
# session-bound rule and a provider-first priority mode do not apply to it:
# its entries are tried in the written order. The usage gate, picks and
# one-shot overrides still apply; when no entry of its list is admitted, the
# task waits.
# Review moves the provider that ran implement to the back of its list.
# A bare model id is anthropic/. Effort: low|medium|high|xhigh|max.
# A target may carry its own `models:` block, which REPLACES this one.
models:
  triage: [claude-sonnet-5@medium]       # daily triage sweep, first admitted
  untracked: standard                    # spec-stage track when no track: label
  # review_second: openai/gpt-sol   # the gated second model (ticket 10, not yet built): validated, not yet consumed
  tracks:
    trivial:
      when: Rote rename, typo, formatting, dependency bump, doc edit with no product decision.
      spec:      [claude-sonnet-5@low]
      plan:      [claude-sonnet-5@medium]
      implement: [claude-sonnet-5@medium, openai/gpt-luna@high]
      review:    [openai/gpt-luna@xhigh, claude-sonnet-5@medium]
    standard:
      when: Bounded change with a clear scope after the questionnaire.
      spec:      [claude-fable-5-1@medium, openai/gpt-astra@medium]
      plan:      [claude-fable-5-1@medium, openai/gpt-astra@medium]
      implement: [claude-sonnet-5@medium, openai/gpt-sol@medium]
      review:    [openai/gpt-astra@medium, claude-opus-5@medium]
    frontend:
      when: Mostly UI or frontend work — components, styling, layout, client behaviour.
      spec:      [claude-fable-5-1@medium, claude-opus-5@medium]
      plan:      [claude-fable-5-1@medium, claude-opus-5@medium]
      implement: [claude-fable-5-1@medium, claude-opus-5@medium]
      review:    [openai/gpt-astra@medium, claude-opus-5@medium]
    architecture:
      when: Heavy backend work, or a change to the architecture (module boundaries, data model or schema, persistence, concurrency, a refactor across modules, a public interface other code depends on).
      spec:      [openai/gpt-astra@high, claude-fable-5-1@high]
      plan:      [openai/gpt-astra@high, claude-fable-5-1@high]
      implement: [openai/gpt-astra@medium, claude-fable-5-1@medium]
      review:    [claude-fable-5-1@high, openai/gpt-astra@high]
    security:
      when: Touches auth, secrets, permissions, or input at a trust boundary. Never below this track.
      spec:      [openai/gpt-astra@high]
      plan:      [openai/gpt-astra@high]
      implement: [openai/gpt-astra@high]
      review:    [claude-fable-5-1@high, openai/gpt-astra@high]
  # Pinned tracks keep their written order: no priority mode reorders them.
  # Listed first to the sessions that choose a track, in this order.
  pinned: [security, architecture, frontend]

targets:
  - name: example-app
    repo: example/example-app
    clone_path: /home/agent/repos/example-app
    worktrees_path: /home/agent/repos/example-app.worktrees
    rank_cmd: "pipenv run python .claude/skills/backlog/rank.py --json"
    # Runs INSIDE a one-shot session-image container (podman run --rm),
    # cwd = the freshly created worktree, before the first session spawns.
    # Must be idempotent; only the worktree, main clone, and persistent
    # npm/xdg cache volumes are mounted. Optional: empty/omitted skips provisioning.
    setup_cmd: "scripts/provision-worktree.sh"
    # Optional. Empty or omitted means no pre-PR e2e run; the review and
    # address-review sessions skip their e2e step and rely on PR checks instead.
    verify_cmd: "make e2e-remote"
    # Run by the session after every ticket and again in the review stage.
    # The repo decides what "green" means (tests, lint, the CRAP gate).
    # Required — a target with no gate_cmd fails config load.
    gate_cmd: "make gate"
    project_number: 1
    project_owner: example
    status_field_id: REPLACE_WITH_PROJECT_ID
    status_ready_option_id: abc123
    status_in_progress_option_id: def456
    status_done_option_id: ghi789   # single-select option id of the board's Done status
    boost_field_id: REPLACE_WITH_PROJECT_ID
    # Optional per-target cap on active tasks, even when box capacity is
    # free. It limits new claims only; woken work and PR feedback still run.
    # Must be between 1 and capacity; omit for no target-specific cap.
    # max_active: 1
