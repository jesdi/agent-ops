capacity: 2
state_dir: /home/agent/agent-ops-state
# Optional: repo where provisioning/pass-crash failure issues are filed.
# Unset -> those failures degrade to a Telegram ping + stderr log only.
infra_repo: jesdi/agent-ops
# Optional: web console base URL (https://<box>.<tailnet>.ts.net). When set,
# the spec-review Telegram ping carries a "read & approve" deep link.
# console_url: https://box.tailnet.ts.net
budget_threshold: 0.8
racing_minutes: 30
racing_threshold: 0.95
# Sized for capacity 2 on the 4 GB box: 2 active sessions x 1500m + ~1 GB
# system baseline fits 3.8 GB RAM with the zram cushion absorbing spikes.
# A session that overruns the cap OOMs inside its own container only.
session_memory: 1500m
session_cpus: "2"
# A live claude redraws its status line every second, so a session with no
# tmux output for this long is stuck (login/trust prompt, or a hung turn) and
# gets parked for the operator. 0 disables stall detection entirely.
stall_after_seconds: 600
# How long a finished spec waits at the review gate for the operator. Once it
# expires the task parks: the spec session ends and BOTH its capacity unit and
# its E2E slot are freed, so the dispatcher keeps claiming and speccing the
# rest of the Ready queue overnight. Reply to the Telegram park message (or
# resume from the web console) to pick the review back up. 0 = park on the
# next pass; attaching holds the task — it will not park while you are attached.
spec_review_grace_minutes: 15
# Days a merged task's Done card stays on the console before flush.
done_retention_days: 7
# Model for the daily triage sessions. Unset -> the models.default below.
# triage_model: claude-opus-4-8
# Which model runs which stage. First matching rule wins; anything unmatched
# gets `default`. An unset Effort on the board never matches an `effort:`
# constraint (fail closed to `default`). A target may carry its own `models:`
# block, which REPLACES this one for that target — rule lists are not merged.
# Labels come from the backlog skill's taxonomy (type: bug/enhancement/
# documentation/question; area: frontend/backend/infra/...), applied at
# capture and confirmed at triage.
models:
  default: claude-opus-4-8
  rules:
    # Research / exploration: the work IS the judgment — Fable end to end.
    # Two rules because labels_include is AND, and repos differ on which
    # label they carry (`research` on portfolio_eval, `question` from the
    # backlog taxonomy).
    - name: research
      when:
        labels_include: [research]
      use: claude-fable-5
    - name: question
      when:
        labels_include: [question]
      use: claude-fable-5

    # Mechanical chores at low effort: dependency bumps, doc edits, CI
    # plumbing — no Fable anywhere. Security-tagged work never takes a
    # cheap exit, whatever its effort score.
    - name: deps-chore
      when:
        effort: {max: 2}
        labels_include: [dependencies]
        labels_exclude: [security]
      use: claude-opus-4-8
    - name: docs-chore
      when:
        effort: {max: 2}
        labels_include: [documentation]
        labels_exclude: [security]
      use: claude-opus-4-8
    - name: ci-chore
      when:
        effort: {max: 2}
        labels_include: [ci]
        labels_exclude: [security]
      use: claude-opus-4-8

    # Very low effort, backend-only change: Opus everywhere. Anything
    # touching frontend/infra, security, or needing a product decision
    # stays on the standard track.
    - name: trivial-backend
      when:
        effort: {max: 1}
        labels_include: [backend]
        labels_exclude: [frontend, infra, security, product]
      use: claude-opus-4-8

    # Everything else — including unscored tasks (unset Effort never
    # matches an effort: rule, so they fail closed to here): Fable writes
    # the spec and the plan (the leverage stages); the multiagent
    # implement stage always runs on Opus.
    - name: standard
      use:
        spec:      claude-fable-5
        plan:      claude-fable-5
        implement: claude-opus-4-8

targets:
  - name: portfolio_eval
    repo: jesdi/portfolio_eval
    clone_path: /home/agent/repos/portfolio_eval
    worktrees_path: /home/agent/repos/portfolio_eval.worktrees
    rank_cmd: "pipenv run python .claude/skills/backlog/rank.py --json"
    # Runs INSIDE a one-shot session-image container (podman run --rm),
    # cwd = the freshly created worktree, before the first session spawns.
    # Must be idempotent. The worktree, the main clone, and persistent
    # npm/xdg cache volumes are mounted; nothing else is.
    setup_cmd: "scripts/provision-worktree.sh"
    verify_cmd: "make e2e-remote"
    project_number: 1
    project_owner: jesdi
    status_field_id: PVTSSF_xxx
    status_ready_option_id: abc123
    status_in_progress_option_id: def456
    status_done_option_id: ghi789   # single-select option id of the board's Done status
    boost_field_id: PVTF_xxx
