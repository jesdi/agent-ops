<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Task artifacts · UI prototype</title>
<style>
:root{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#18212f;background:#eef0f3;font-size:14px}*{box-sizing:border-box}body{margin:0}button,a,select,summary{touch-action:manipulation}button,select,textarea{font:inherit}button,a,select{outline-offset:4px}button,.button{min-height:44px;border:1px solid #d1d5db;border-radius:6px;background:white;padding:10px 14px;font-weight:500;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;color:#1d4ed8}button:hover,.button:hover{background:#f3f6fb}button:disabled{color:#6b7280;cursor:default;background:#f3f4f6}a{color:#1d4ed8}h1,h2,h3,p{margin:0}h1{font-size:21px;line-height:1.35}h2{font-size:15px}h3{font-size:16px}p{line-height:1.6}.muted{color:#697386}.small{font-size:12px}.mono{font-family:ui-monospace,SFMono-Regular,monospace;overflow-wrap:anywhere}.toolbar{background:#18212f;color:white;padding:14px 24px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}.toolbar strong{font-size:14px}.toolbar .muted{color:#bdc7d6}.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto}.toolbar button{background:#293443;color:#e5e7eb;border-color:#485364}.toolbar button[aria-pressed=true]{background:white;color:#18212f}.toolbar select{min-height:44px;border-radius:6px;padding:8px;background:#293443;color:white;border:1px solid #485364;max-width:100%}.canvas{container-type:inline-size;max-width:1160px;margin:24px auto;background:#f9fafb;border:1px solid #d9dee5;border-radius:8px;overflow:hidden;box-shadow:0 6px 28px #18212f08}.canvas.phone{max-width:390px}.nav{background:white;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:24px;padding:16px 24px}.brand{font-weight:700;color:#111827}.nav span{font-size:13px}.nav .status{margin-left:auto;font-size:12px;color:#48715a}.dot{display:inline-block;width:7px;height:7px;background:#22a06b;border-radius:50%;margin-right:6px}main{padding:24px;display:grid;gap:18px}.back{font-size:13px;margin-bottom:14px;display:block;color:#697386}.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;font-size:12px;color:#697386}.badge{display:inline-flex;padding:4px 8px;border-radius:4px;font-size:11px;font-weight:600;background:#eff2f6;color:#536174;white-space:nowrap}.purple{background:#f3e8ff;color:#7e22ce}.green{background:#e8f5ec;color:#237344}.blue{background:#eaf1ff;color:#245cc0}.timeline{display:flex;gap:7px;flex-wrap:wrap;margin-top:15px}.timeline span{font-size:11px;color:#697386;padding:4px 8px;background:#eceff3;border-radius:4px}.timeline .current{background:#f3e8ff;color:#7e22ce}.panel{border:1px solid #d1d5db;background:white;border-radius:6px;overflow:hidden}.panel-head{padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}.panel-head p{margin-top:4px}.review{border-color:#b9cced}.review .panel-head{align-items:flex-start}.actions{display:flex;gap:8px;flex-wrap:wrap}.approve{background:#16803d;color:white;border-color:#16803d}.approve:hover{background:#126a32}.preview{margin:0 20px 18px;padding:14px 16px;border-radius:5px;background:#f9fafb;border:1px solid #e5e7eb}.preview p{font-size:13px;margin-top:6px;max-width:760px}.preview summary{cursor:pointer;color:#4b5563;font-size:12px;margin-top:12px;min-height:28px}.preview details p{padding-top:6px}.row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px 20px;border-top:1px solid #e5e7eb}.icon{width:38px;height:42px;border:1px solid #dce3ed;border-radius:6px;display:grid;place-items:center;background:#f7f9fc;font-family:ui-monospace,monospace;color:#61748e;font-size:12px}.name{font-size:14px;font-weight:600;line-height:1.4}.name .badge{margin-left:7px;vertical-align:middle}.row p{margin-top:5px;font-size:12px;color:#697386}.footnote{padding:12px 20px;background:#fafbfc;border-top:1px solid #e5e7eb;font-size:12px;color:#697386;line-height:1.5}.notice{background:#fffbeb;border:1px solid #f0d58e;border-radius:5px;padding:12px 16px;color:#89611a;font-size:13px;line-height:1.6}.notice.in-panel{margin:0 20px 16px}.empty{padding:24px 20px;border-top:1px solid #e5e7eb}.session-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.terminal{background:#111827;color:#d0d9e6;border-radius:6px;padding:18px;font:12px/1.9 ui-monospace,SFMono-Regular,monospace;min-height:130px}.terminal .muted{color:#8b9ab1}.reply{display:grid;gap:8px}.reply textarea{resize:vertical;min-height:75px;width:100%;border:1px solid #d1d5db;border-radius:5px;padding:12px;background:white}.reply .actions{justify-content:flex-end}.demo-note{max-width:1160px;margin:0 auto 30px;padding:0 16px;text-align:center;color:#697386;font-size:12px;line-height:1.6}.viewer{max-width:820px;margin:24px auto;padding:32px;background:white;border:1px solid #d1d5db;border-radius:8px}.viewer h1,.viewer h2,.viewer p{margin-bottom:18px}.diagram{display:flex;gap:12px;align-items:center;justify-content:center;padding:32px 0;flex-wrap:wrap}.diagram span{border:1px solid #b9cced;background:#eff6ff;border-radius:6px;padding:20px}.prototype-card{background:#f9fafb;border:1px solid #d1d5db;border-radius:6px;padding:22px}.toast{color:#237344;font-size:13px;padding:8px 0} [hidden]{display:none!important}
@container (max-width:600px){.nav{padding:14px 16px;gap:18px}.nav .status{display:none}main{padding:18px 14px;gap:16px}h1{font-size:20px}.panel-head{padding:16px;align-items:flex-start;flex-wrap:wrap}.review .actions{width:100%;display:grid;grid-template-columns:1fr}.review .actions>*{width:100%}.preview{margin:0 16px 16px}.row{padding:16px;grid-template-columns:32px minmax(0,1fr) auto;gap:10px}.icon{width:32px;height:38px;font-size:11px}.row .button{padding:9px 11px}.name .badge{margin:5px 0 0;display:table}.footnote{padding:12px 16px}.notice.in-panel{margin:0 16px 16px}.terminal{font-size:11px}.timeline span{font-size:10px}.row p{font-size:11px}.back{margin-bottom:12px}}
@media(max-width:600px){.toolbar{padding:14px 16px;gap:12px}.controls{margin-left:0;gap:6px}.controls label{width:100%}.canvas,.canvas.phone{margin:12px auto;max-width:100%;border-radius:0}.viewer{margin:12px;padding:22px}}
</style>
</head>
<body>
<div class="toolbar"><div><strong>Task artifacts · UI prototype</strong><p class="muted small">Sample content · interactions are simulated</p></div><div class="controls"><button id="desktop" aria-pressed="true">Desktop</button><button id="mobile" aria-pressed="false">Phone</button><label for="scenario" class="small">Task state</label><select id="scenario"><option value="review">Awaiting spec approval</option><option value="implement">Implementation session</option><option value="unpublished">Spec publish failed</option><option value="done">Done · within 30 days</option><option value="expired">Done · after cleanup</option><option value="empty">No artifacts yet</option></select></div></div>
<div class="canvas" id="canvas"><nav class="nav" aria-label="Application"><span class="brand">agent-ops</span><span>Board</span><span>History</span><span class="status"><i class="dot"></i>box connected</span></nav><main id="task"></main></div>
<p class="demo-note" id="demo-note">Try Phone and switch task states. Approve spec uses two taps. Artifact links open local sample previews in a new tab.</p>
<script>
const $=id=>document.getElementById(id);
const sample=[['spec','MD','Task artifacts specification','Spec · GitHub · updated 4 min ago'],['prototype','HTML','Task page prototype','Prototype · Web preview · updated 28 min ago'],['diagram','SVG','Artifact lifecycle diagram','Diagram · Web preview · updated 42 min ago'],['answers','MD','Review questions & answers','Questionnaire · GitHub · updated 1 hr ago']];
let armed=false;
const artifactLink=(id,label='Open ↗')=>`<a class="button" href="?artifact=${id}" target="_blank" rel="noopener" aria-label="${label==='Open ↗'?'Open '+sample.find(x=>x[0]===id)[2]:label}">${label}</a>`;
function render(){
 armed=false;const state=$('scenario').value;const review=state==='review'||state==='unpublished';const expired=state==='expired';const finished=state==='done'||expired;const empty=state==='empty';const failed=state==='unpublished';
 const label=review?'Awaiting spec review':finished?'Done':empty?'Spec in progress':'Implementing · ticket 2 of 4';
 $('task').innerHTML=`<header><span class="back">← Board / agent-ops / #142</span><h1>Keep task artifacts accessible across sessions</h1><div class="meta"><span class="badge ${review?'purple':finished?'green':'blue'}">${label}</span><span>agent-ops #142</span><span>·</span><span>${finished?'Completed Sep 13, 2026':'Updated just now'}</span></div><p class="small muted mono" style="margin-top:10px">Branch: task/142-task-artifacts</p><div class="timeline"><span>Spec ${empty?'— ongoing':'18m'}</span>${!empty?`<span class="${review?'current':''}">Spec review ${review?'— ongoing':'6m'}</span>`:''}${!review&&!empty?`<span>Plan 4m</span><span class="${!finished?'current':''}">Implement ${finished?'32m':'— ongoing'}</span>`:''}${finished?'<span>Review 9m</span><span>Done</span>':''}</div></header>
 <details class="panel"><summary style="padding:15px 20px;cursor:pointer;font-size:13px;font-weight:500">Issue description</summary><p style="padding:0 20px 18px;font-size:13px">Keep the spec, prototype, diagrams and review answers accessible from the task page across sessions, on desktop and mobile.</p></details>
 ${review?`<section class="panel review" aria-label="Spec approval"><div class="panel-head"><div><h2>Spec awaiting review</h2><p class="muted small">Review the spec, then approve to continue.</p></div><div class="actions">${failed?'':artifactLink('spec','View spec on GitHub ↗')}<button class="approve" id="approve">Approve spec</button></div></div>${failed?'<div class="notice in-panel">Spec hasn’t been published to GitHub yet. You can still read and approve the local spec below.</div>':''}<div class="preview"><h3>Task artifacts specification</h3><p>Give each task a persistent collection of review artifacts, accessible throughout its sessions. Each artifact has one URL that always shows its latest content.</p><details><summary>Read full local spec</summary><p><strong>Registration.</strong> Sessions automatically register review material and exclude scratch files and logs.</p><p><strong>Lifecycle.</strong> Keep artifacts across sessions. Remove box copies 30 days after a task finishes. Reopening cancels cleanup.</p></details></div></section>`:''}
 <section class="panel" aria-label="Artifacts"><div class="panel-head"><div><h2>Artifacts <span class="badge" style="margin-left:5px">${empty?'0':'4'}</span></h2><p class="muted small">Review material from every session of this task.</p></div></div>${empty?'<div class="empty"><p>No artifacts yet.</p><p class="small muted">Review material will appear here as sessions create it.</p></div>':sample.map(([id,icon,name,meta])=>{const removed=expired&&(id==='prototype'||id==='diagram');const unavailable=failed&&id==='spec';return `<div class="row"><div class="icon" aria-hidden="true">${icon}</div><div><div class="name">${name}${id==='spec'?` <span class="badge ${review?'purple':'green'}">${review?'Awaiting approval':'Approved'}</span>`:''}</div><p>${removed?'Box copy removed after 30 days':unavailable?'Not published · local spec available above':meta}</p></div>${removed?'<span class="badge">Expired</span>':unavailable?'<span class="badge">Local only</span>':artifactLink(id)}</div>`}).join('')}
 ${finished?`<div class="footnote">${expired?'Box copies were removed on Oct 13, 2026. GitHub artifacts remain available.':'Box copies will be removed on Oct 13, 2026 — 30 days after completion. GitHub artifacts will remain available.'}</div>`:!empty?'<div class="footnote">Links open the latest version in a new tab.</div>':''}</section>
 <section aria-label="Session"><div class="session-head"><h2>${finished?'Last session':'Session'}</h2><span class="badge">${finished?'Review · finished':review?'Spec · awaiting approval':empty?'Spec · running':'Implement · running'}</span></div><div class="terminal"><span class="muted">${finished?'Review complete.':review?'Spec ready for your review.':empty?'Exploring the task requirements…':'Working on ticket 02: artifact delivery.'}</span><br>${finished?'Pull request merged. Task marked done.':review?'Draft committed and '+(failed?'available locally.':'pushed to the task branch.')+'<br>Waiting for approval before planning.':empty?'Review artifacts will be registered as they are produced.':'Reading the spec and prototype from the previous session.<br>Implementing stable artifact URLs…'}</div></section>
 ${!finished?'<div class="reply"><label for="reply">Reply</label><textarea id="reply" placeholder="Ask a question or share feedback…"></textarea><div class="actions"><button id="send">Send message</button></div><p id="feedback" class="toast" role="status"></p></div>':''}`;
 if($('approve'))$('approve').onclick=()=>{if(!armed){armed=true;$('approve').textContent='Tap again to approve';return}$('scenario').value='implement';render()};
 if($('send'))$('send').onclick=()=>{$('feedback').textContent=$('reply').value.trim()?'Demo message sent. No task was changed.':'Write a message first.';};
}
$('scenario').onchange=render;
for(const mode of ['desktop','mobile'])$(mode).onclick=()=>{$('canvas').classList.toggle('phone',mode==='mobile');$('desktop').setAttribute('aria-pressed',String(mode==='desktop'));$('mobile').setAttribute('aria-pressed',String(mode==='mobile'))};
const query=new URLSearchParams(location.search);const artifact=query.get('artifact');
if(artifact){const item=sample.find(x=>x[0]===artifact);document.querySelector('.controls').hidden=true;$('canvas').hidden=true;$('demo-note').hidden=true;const viewer=document.createElement('main');viewer.className='viewer';viewer.innerHTML=item?`<span class="badge blue" style="margin-bottom:20px">Sample artifact preview</span><h1>${item[2]}</h1>${artifact==='spec'||artifact==='answers'?'<p class="notice">In the implemented UI, this link opens this Markdown file on GitHub’s task branch. This is a local sample, not GitHub.</p>':''}${artifact==='prototype'?'<div class="prototype-card"><h2>Task page · prototype artifact</h2><p>Example of a rendered HTML artifact opening in its own tab.</p><button onclick="this.textContent=\'Prototype interaction works\'">Try interaction</button></div>':artifact==='diagram'?'<p>Artifact lifecycle</p><div class="diagram"><span>Session creates</span>→<span>Register artifact</span>→<span>Review on task page</span></div><p class="muted">Update the same artifact → keep the same URL.</p>':artifact==='answers'?'<h2>Review decisions</h2><p><strong>Which material is registered?</strong><br>Artifacts used for human review or to guide later work.</p><p><strong>Do we need version history?</strong><br>No. Each URL shows the latest content.</p>':'<h2>Overview</h2><p>Provide a persistent Artifacts section for each task, accessible on desktop and mobile.</p><h2>Registration</h2><p>Sessions automatically register prototypes, specs, diagrams and review answers. Scratch files and logs are excluded.</p><h2>Retention</h2><p>Remove box copies 30 days after a terminal state. Reopening cancels the countdown. Keep GitHub files.</p>'}`:'<h1>Artifact not found</h1>';document.body.append(viewer)}else render();
</script>
</body>
</html>
